<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-4">
    <div class="row align-items-center">

        <div class="col-md-2">
            <img src="images" alt="Resume Logo" width="50">
        </div>

        <div class="col-md-6">
            <h1>Build Your Own Resume</h1>
        </div>

        <div class="col-md-4 text-end">
            <select class="form-select d-inline w-auto">
                <option>Select Language</option>
                <option>English</option>
                <option>Tamil</option>
                <option>Hindi</option>
                <option>Kannada</option>
            </select>
            <button class="btn btn-dark ms-2">🌙</button>
            <a href="#" class="ms-2">Login</a>
            <a href="#" class="ms-2">Sign Up</a>
        </div>

    </div>

    <div class="row mt-4">
        <div class="col-12 text-center">
            <h3>Build professional outstanding resume with our CV builder</h3>
        </div>
    </div>
    <div class="row mt-4 text-center">

        <div class="col-md-4 mb-3">
            <a href="create.html" class="btn btn-primary w-100">
                Create your resume
            </a>
        </div>

        <div class="col-md-4 mb-3">
            <a href="sample resume.html" class="btn btn-success w-100">
                Sample resume
            </a>
        </div>

        <div class="col-md-4 mb-3">
            <a href="templates.html" class="btn btn-warning w-100">
                Multiple templates
            </a>
        </div>

    </div>
    <div class="row mt-5">
        <div class="col-12 text-center">
            <a href="about.html" class="me-3">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
