<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Resume</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card p-4 shadow">
        <h2 id="rName"></h2>
        <p><strong>Email:</strong> <span id="rEmail"></span></p>
        <p><strong>Skills:</strong> <span id="rSkills"></span></p>
        <p><strong>Phone:</strong> <span id="rPhone"></span></p>
        <div class="card p-4 shadow">

    <h2 id="rName"></h2>

    <p><strong>Email:</strong> <span id="rEmail"></span></p>

    <p><strong>Phone:</strong> <span id="rPhone"></span></p>

    <hr>

    <h4>Career Objective</h4>
    <p id="rObjective"></p>

    <h4>Programming Languages</h4>
    <p id="rLanguages"></p>

    <h4>Technical Skills</h4>
    <p id="rSkills"></p>

    <hr>

    <h4>Internship</h4>

    <p><strong>Company:</strong> <span id="rCompany"></span></p>

    <p><strong>Role:</strong> <span id="rRole"></span></p>

    <p><strong>Mode:</strong> <span id="rMode"></span></p>

    <p><strong>Duration:</strong> <span id="rDuration"></span></p>

    <hr>

    <h4>Certifications</h4>

    <p id="rCertificates"></p>

    <hr>

    <h4>Professional Links</h4>

    <p><strong>GitHub:</strong> <span id="rGithub"></span></p>

    <p><strong>LinkedIn:</strong> <span id="rLinkedin"></span></p>

    <p><strong>LeetCode:</strong> <span id="rLeetcode"></span></p>

    <p><strong>HackerRank:</strong> <span id="rHackerrank"></span></p>

</div>
    </div>

</div>

</html>
