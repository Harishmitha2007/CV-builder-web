<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Resume</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">
    <h2>Create Your Resume</h2>

    <!-- ✅ YOUR FORM GOES HERE -->
    <form id="resumeForm">

        <input type="text" id="name" class="form-control mb-3" placeholder="Enter Name">

        <input type="email" id="email" class="form-control mb-3" placeholder="Enter Email">

        <textarea id="skills" class="form-control mb-3" placeholder="Enter Skills"></textarea>

        <button type="submit" class="btn btn-primary">Generate Resume</button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
