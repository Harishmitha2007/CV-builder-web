<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Resume</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4 mb-5">

    <h2 class="text-center mb-4">Create Your Resume</h2>

    <form id="resumeForm">

        <h4>Personal Details</h4>

        <input type="text" id="name" class="form-control mb-3" placeholder="Full Name" required>

        <input type="email" id="email" class="form-control mb-3" placeholder="Email" required>

        <input type="text" id="phone" class="form-control mb-3" placeholder="Phone Number" required>

        <textarea id="objective" class="form-control mb-3" rows="3"
            placeholder="Career Objective"></textarea>

        <hr>

        <h4>Programming Languages Known</h4>

        <div class="mb-3">
            <input type="checkbox" name="languages" value="Java"> Java
            <input type="checkbox" name="languages" value="Python" class="ms-3"> Python
            <input type="checkbox" name="languages" value="C" class="ms-3"> C
            <input type="checkbox" name="languages" value="C++" class="ms-3"> C++
            <input type="checkbox" name="languages" value="JavaScript" class="ms-3"> JavaScript
            <input type="checkbox" name="languages" value="PHP" class="ms-3"> PHP
        </div>

        <hr>

        <h4>Technical Skills</h4>

        <div class="mb-3">
            <input type="checkbox" name="skills" value="HTML"> HTML
            <input type="checkbox" name="skills" value="CSS" class="ms-3"> CSS
            <input type="checkbox" name="skills" value="Bootstrap" class="ms-3"> Bootstrap
            <input type="checkbox" name="skills" value="JavaScript" class="ms-3"> JavaScript
            <input type="checkbox" name="skills" value="React" class="ms-3"> React
            <input type="checkbox" name="skills" value="Angular" class="ms-3"> Angular
            <input type="checkbox" name="skills" value="Node.js" class="ms-3"> Node.js
            <input type="checkbox" name="skills" value="Express.js" class="ms-3"> Express.js
            <input type="checkbox" name="skills" value="MongoDB" class="ms-3"> MongoDB
            <input type="checkbox" name="skills" value="MySQL" class="ms-3"> MySQL
            <input type="checkbox" name="skills" value="Git" class="ms-3"> Git
            <input type="checkbox" name="skills" value="GitHub" class="ms-3"> GitHub
        </div>

        <hr>

        <h4>Internship Details</h4>

        <input type="text" id="company" class="form-control mb-3"
            placeholder="Company Name">

        <input type="text" id="role" class="form-control mb-3"
            placeholder="Role">

        <select id="mode" class="form-control mb-3">
            <option value="">Select Internship Mode</option>
            <option>Online</option>
            <option>Offline</option>
            <option>Hybrid</option>
        </select>

        <input type="text" id="duration" class="form-control mb-3"
            placeholder="Internship Duration (Example: Jan 2026 - Mar 2026)">

        <hr>

        <h4>Certifications</h4>

        <textarea id="certifications" class="form-control mb-3"
            rows="4"
            placeholder="NPTEL, CodeAlpha, Samsung Innovation Campus etc"></textarea>

        <hr>

        <h4>Professional Links</h4>

        <input type="url" id="github" class="form-control mb-3"
            placeholder="GitHub Profile Link">

        <input type="url" id="linkedin" class="form-control mb-3"
            placeholder="LinkedIn Profile Link">

        <input type="url" id="leetcode" class="form-control mb-3"
            placeholder="LeetCode Profile Link">

        <input type="url" id="hackerrank" class="form-control mb-3"
            placeholder="HackerRank Profile Link">

        <button type="submit" class="btn btn-primary w-100">
            Generate Resume
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
